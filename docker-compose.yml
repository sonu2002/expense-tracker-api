# Runs the API with a real PostgreSQL database:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expenses
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/expenses
      DB_USER: expenses
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"
